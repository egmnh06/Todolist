
<main class="todo-container">
    <div class="add-task">
        <input type="text" [(ngModel)]="inputValue" placeholder="Enter new task">
        <button (click)="addTask()"> Add </button>
    </div>
    
    <ul class="task-list">
        @for (todoItem of list(); track $index) {
            <li [ngClass]="{'completed': todoItem.completed}">
            <input
                type="checkbox"
                [(checked)]="todoItem.completed"
                (change)="toggleCompleted(todoItem.id)"
            />
            <span [class.completed]="todoItem.completed">{{ todoItem.task }}</span>
            <button class="delete-btn" (click)="deleteTask(todoItem.id)">Delete</button>
        </li>
        }
    </ul>
</main>


<router-outlet />
